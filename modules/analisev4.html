<!DOCTYPE html>
<html lang="pt-pt">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Análise</title>
  <link rel="stylesheet" href="../css/styles.pcolor.css">
  <link rel="stylesheet" href="../css/mobile.css">
  <link rel="stylesheet" href="../css/theme-dark.css">
  <link rel="stylesheet" href="../css/analisev4.css">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="../icons/icon-192-v2.png">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#101722">
</head>
<body id="analisev4-page" data-page="analisev4" data-theme="dark">
  <main>
    <div class="page-intro analisev4-intro">
      <h2>Análise</h2>
    </div>

    <aside
      class="qualidade-v4-alert"
      id="qualidade-v4-alert"
      role="alert"
      aria-live="assertive"
      hidden
    >
      <div id="qualidade-v4-alert-content"></div>
    </aside>

    <div class="viz-card analisev4-panel">
      <section id="mod-progresso-v4" class="report-section" data-module="progresso-v4">
        <div class="progresso-v4-card">
          <div class="analisev4-dashboard-header">
            <div class="progresso-v4-title">
              <h3>Progresso <span id="progresso-v4-current-year">—</span> vs <span id="progresso-v4-previous-year">—</span></h3>
              <p id="progresso-v4-cutoff">—</p>
            </div>
            <div class="analisev4-global-controls">
              <div class="segmented segmented--primary analisev4-shared-view" role="group" aria-label="Selecionar vista da análise">
                <button class="filter-btn active" data-faturacao-v4-view="total" aria-pressed="true">Total</button>
                <button class="filter-btn" data-faturacao-v4-view="123" aria-pressed="false">123</button>
                <button class="filter-btn" data-faturacao-v4-view="1248" aria-pressed="false">1248</button>
                <button class="filter-btn" data-faturacao-v4-view="compare" aria-pressed="false">Comparar</button>
              </div>
              <div class="segmented segmented--compact analisev4-fee-switch" role="group" aria-label="Taxa Airbnb">
                <button class="chip-btn active" data-airbnb-fee="included" aria-pressed="true">Com taxa Airbnb</button>
                <button class="chip-btn" data-airbnb-fee="excluded" aria-pressed="false">Sem taxa Airbnb</button>
              </div>
            </div>
          </div>

          <div class="progresso-v4-grid" aria-live="polite">
            <article class="progresso-v4-tile progresso-v4-tile--primary" data-progress-kpi="ytd">
              <span class="progresso-v4-label">Acumulado YTD</span>
              <div class="progresso-v4-single">
                <strong id="progresso-v4-ytd-value">—</strong>
                <small id="progresso-v4-ytd-meta">—</small>
                <span class="progresso-v4-delta" id="progresso-v4-ytd-delta">—</span>
              </div>
              <div class="progresso-v4-comparison" data-progress-comparison="ytd" hidden></div>
            </article>
            <article class="progresso-v4-tile" data-progress-kpi="month">
              <span class="progresso-v4-label">Mês atual</span>
              <div class="progresso-v4-single">
                <strong id="progresso-v4-month-value">—</strong>
                <small id="progresso-v4-month-meta">—</small>
                <span class="progresso-v4-delta" id="progresso-v4-month-delta">—</span>
              </div>
              <div class="progresso-v4-comparison" data-progress-comparison="month" hidden></div>
            </article>
            <article class="progresso-v4-tile" data-progress-kpi="avg">
              <span class="progresso-v4-label">Média / Noite YTD</span>
              <div class="progresso-v4-single">
                <strong id="progresso-v4-avg-value">—</strong>
                <small id="progresso-v4-avg-meta">—</small>
                <span class="progresso-v4-delta" id="progresso-v4-avg-delta">—</span>
              </div>
              <div class="progresso-v4-comparison" data-progress-comparison="avg" hidden></div>
            </article>
            <article class="progresso-v4-tile" data-progress-kpi="nights">
              <span class="progresso-v4-label">Noites YTD</span>
              <div class="progresso-v4-single">
                <strong id="progresso-v4-nights-value">—</strong>
                <small id="progresso-v4-nights-meta">—</small>
                <span class="progresso-v4-delta" id="progresso-v4-nights-delta">—</span>
              </div>
              <div class="progresso-v4-comparison" data-progress-comparison="nights" hidden></div>
            </article>
            <article class="progresso-v4-tile" data-progress-kpi="target">
              <span class="progresso-v4-label">Para total anterior</span>
              <div class="progresso-v4-single">
                <strong id="progresso-v4-target-value">—</strong>
                <small id="progresso-v4-target-meta">—</small>
                <div
                  class="progresso-v4-target-track"
                  id="progresso-v4-target-progress"
                  role="progressbar"
                  aria-label="Progresso para igualar o total do ano anterior"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  aria-valuenow="0"
                >
                  <span class="progresso-v4-target-fill" id="progresso-v4-target-bar"></span>
                  <span class="progresso-v4-target-label" id="progresso-v4-target-delta">—</span>
                </div>
              </div>
              <div class="progresso-v4-comparison" data-progress-comparison="target" hidden></div>
            </article>
          </div>
        </div>
      </section>

      <section id="mod-faturacao-v4" class="report-section" data-module="faturacao-v4">
        <div class="chart-and-table faturacao-v4-card">
          <div class="analisev4-section-header">
            <h3>Análise mensal</h3>
          </div>
          <div class="section-heading analisev4-card-heading faturacao-v4-heading">
            <label class="analisev4-mobile-select" for="faturacao-v4-metric-select">
              <span>Métrica</span>
              <select id="faturacao-v4-metric-select">
                <option value="revenue">Faturação</option>
                <option value="occupancy">Ocupação</option>
                <option value="cleaning">Taxa de limpeza</option>
                <option value="revpan">RevPAN</option>
                <option value="avg-night">Média/noite</option>
              </select>
            </label>
            <div class="segmented segmented--primary faturacao-v4-metric-switch" role="group" aria-label="Selecionar métrica do gráfico">
              <button class="filter-btn active" data-faturacao-v4-metric="revenue" aria-pressed="true">Faturação</button>
              <button class="filter-btn" data-faturacao-v4-metric="occupancy" aria-pressed="false">Ocupação</button>
              <button class="filter-btn" data-faturacao-v4-metric="cleaning" aria-pressed="false">Taxa de limpeza</button>
              <button class="filter-btn" data-faturacao-v4-metric="revpan" aria-pressed="false">RevPAN</button>
              <button class="filter-btn" data-faturacao-v4-metric="avg-night" aria-pressed="false">Média/noite</button>
            </div>
            <div class="toolbar-left segmented segmented--compact" id="faturacao-v4-mode-switch" role="group" aria-label="Selecionar modo do gráfico">
              <button class="chip-btn active" data-faturacao-v4-mode="mes" aria-pressed="true">Mês</button>
              <button class="chip-btn" data-faturacao-v4-mode="cumulativo" aria-pressed="false">Cumulativo</button>
            </div>
          </div>

          <div class="chart-toolbar faturacao-v4-toolbar">
            <div class="toolbar-right">
              <button type="button" class="chip-btn" id="faturacao-v4-toggle-chart-years" aria-pressed="false">Ver todos os anos</button>
            </div>
          </div>

          <div class="chart-wrap faturacao-v4-chart-wrap">
            <canvas id="chart-faturacao-v4" aria-label="Gráfico de faturação, ocupação, taxa de limpeza, RevPAN ou média por noite" role="img"></canvas>
          </div>

          <div class="faturacao-v4-table-actions">
            <button type="button" class="chip-btn" id="faturacao-v4-toggle-table" aria-expanded="false">Mostrar tabela</button>
            <button type="button" class="chip-btn faturacao-v4-history-btn" id="faturacao-v4-toggle-years" hidden>Mostrar anos desde 2024</button>
            <button type="button" class="chip-btn faturacao-v4-expand-btn" id="faturacao-v4-expand-table" aria-expanded="false" hidden>Ver em largura total</button>
          </div>

          <div class="table-wrap faturacao-v4-table-wrap" id="faturacao-v4-table-wrap" hidden>
            <div id="tabela-faturacao-v4"></div>
          </div>
        </div>
      </section>

      <section id="mod-reservas-v4" class="report-section" data-module="reservas-v4">
        <details class="reservas-v4-card">
          <summary class="analisev4-details-summary">
            <h3>Detalhe das reservas</h3>
            <span id="reservas-v4-context">Total</span>
          </summary>
          <div class="reservas-v4-content">

            <div class="reservas-v4-controls">

              <label class="reservas-v4-year-control" for="reservas-v4-year">
                <span>Período</span>
                <select id="reservas-v4-year" aria-label="Selecionar ano"></select>
              </label>

              <label class="analisev4-mobile-select" for="reservas-v4-table-select">
                <span>Detalhe</span>
                <select id="reservas-v4-table-select">
                  <option value="nights">Noites por reserva</option>
                  <option value="guests">Hóspedes por reserva</option>
                  <option value="leadtime">Antecedência das reservas</option>
                  <option value="weekpart">Semana vs fim de semana</option>
                  <option value="weekdays">Dias da semana</option>
                  <option value="booking-month">Mês em que reservaram</option>
                </select>
              </label>

              <div class="segmented segmented--compact reservas-v4-table-switch" role="group" aria-label="Selecionar detalhe das reservas">
                <button class="chip-btn active" data-reservas-v4-table="nights" aria-pressed="true">Noites por reserva</button>
                <button class="chip-btn" data-reservas-v4-table="guests" aria-pressed="false">Hóspedes por reserva</button>
                <button class="chip-btn" data-reservas-v4-table="leadtime" aria-pressed="false">Antecedência das reservas</button>
                <button class="chip-btn" data-reservas-v4-table="weekpart" aria-pressed="false">Semana vs fim de semana</button>
                <button class="chip-btn" data-reservas-v4-table="weekdays" aria-pressed="false">Dias da semana</button>
                <button class="chip-btn" data-reservas-v4-table="booking-month" aria-pressed="false">Mês em que reservaram</button>
              </div>
            </div>

            <div class="reservas-v4-table-actions">
              <button type="button" class="chip-btn" id="reservas-v4-expand-table" aria-expanded="false">Ver em largura total</button>
            </div>

            <div class="table-wrap reservas-v4-table-wrap">
              <div id="reservas-v4-table" aria-live="polite"></div>
            </div>
          </div>
        </details>
      </section>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
  <script type="module" src="../js/analisev2-error-handler.js"></script>
  <script type="module" src="../js/analisev2-loading.js"></script>
  <script type="module" src="../js/script.js"></script>
  <script type="module" src="../js/analisev4-faturacao.js"></script>
  <script type="module" src="../js/analisev4-reservas.js"></script>
</body>
</html>
