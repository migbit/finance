<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-in</title>
  <link rel="stylesheet" href="../css/styles.pcolor.css">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <meta name="theme-color" content="#f8f9fb">
  <meta name="referrer" content="no-referrer">
  <style>
    .public-checkin [hidden] { display: none !important; }
    body.public-checkin {
      --primary: #1d4ed8;
      min-height: 100vh;
      background: #f8f9fb;
    }

    .public-checkin main {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 18px 16px 34px;
    }

    .checkin-shell {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 22px;
      box-shadow: var(--shadow-1);
    }

    .checkin-header {
      margin-bottom: 16px;
    }

    .language-field {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 14px;
    }

    .language-field label {
      display: grid;
      gap: 6px;
      min-width: 180px;
      color: var(--text-dim);
      font-size: 0.88rem;
      font-weight: 700;
    }

    .language-field select {
      width: 100%;
    }

    .checkin-header h1 {
      font-size: 1.45rem;
      line-height: 1.25;
      margin: 0 0 8px;
      text-align: left;
    }

    .checkin-header p {
      color: var(--text-dim);
      margin: 0;
    }

    .form-intro { margin: 4px 0 18px; }
    .form-intro h2 { text-align: left; font-size: 1.25rem; margin: 0 0 8px; padding: 0; }
    .form-intro p, .field-help, .save-help { color: #475569; font-size: 0.9rem; line-height: 1.5; }
    .public-checkin input, .public-checkin select { scroll-margin: 24px 0 180px; }
    .property-context { margin: 0 0 16px; line-height: 1.5; }
    .property-context strong { display: block; font-size: 1.1rem; }
    .property-context small { display: block; color: #475569; }
    .registration-information { margin-top: 24px; border-top: 1px solid var(--border); padding-top: 16px; color: #475569; font-size: .9rem; line-height: 1.6; }
    .registration-information h2 { font-size: 1rem; padding: 0; text-align: left; color: var(--text); }
    .registration-information summary { cursor: pointer; padding: 12px 0; font-weight: 700; }
    .registration-information a, .field-help a { color: #1d4ed8; text-decoration: underline; }
    .registration-information p { margin: 10px 0; }
    #legal-information { scroll-margin-top: 20px; }
    .form-intro p { margin: 0; }
    .field-help { display: block; margin: 5px 0 0; }
    .field-error { display: block; color: #991b1b; margin-top: 5px; font-size: 0.9rem; }
    .field [aria-invalid="true"] { border: 2px solid #b91c1c; }
    .guest-progress summary { cursor: pointer; padding: 10px 0; font-weight: 700; }
    .guest-progress progress { width: 100%; height: 10px; accent-color: var(--primary); }
    .guest-progress details .guest-slot { margin-top: 8px; }
    .guest-slot-complete strong { color: #166534; }
    .checkin-message:focus, .form-intro h2:focus { outline: none; }
    .checkin-message h2 { color: inherit; text-align: left; margin: 0 0 8px; font-size: 1.2rem; padding: 0; }
    .checkin-message p { margin: 6px 0; }
    .save-help { width: 100%; margin: 0; text-align: center; }
    #submit-guest { min-height: 52px; font-size: 1rem; flex: 1; }

    .stay-dates {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .stay-date {
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fbfcfe;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .checkin-grid {
      display: grid;
      gap: 14px;
    }

    #guest-form {
      display: grid;
      gap: 4px;
    }

    .guest-progress {
      display: grid;
      gap: 8px;
      margin: 0 0 18px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fbfcfe;
    }

    .guest-progress h2 {
      text-align: left;
      font-size: 1rem;
      margin: 0;
      padding: 0;
    }

    .guest-slot {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      font-size: 0.92rem;
    }

    button.guest-slot-empty {
      width: 100%;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      border-color: color-mix(in srgb, var(--primary) 45%, var(--border));
    }

    button.guest-slot-empty:hover,
    button.guest-slot-empty:focus-visible {
      background: color-mix(in srgb, var(--primary) 7%, var(--surface));
      border-color: var(--primary);
    }

    .guest-slot-cta {
      color: var(--primary);
      font-weight: 700;
      text-align: right;
    }

    .guest-slot strong {
      white-space: nowrap;
    }

    .guest-slot span {
      color: var(--text-dim);
      text-align: right;
      overflow-wrap: anywhere;
    }

    .guest-slot-info {
      display: grid;
      gap: 3px;
    }

    .guest-slot-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .guest-progress-add {
      justify-self: start;
      margin-top: 4px;
    }

    .checkin-grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .declaration {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      align-items: start;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fbfcfe;
      margin-top: 14px;
      color: var(--text);
      font-size: 0.92rem;
    }

    .declaration input {
      width: 20px;
      height: 20px;
      accent-color: var(--primary);
      margin-top: 2px;
    }

    .checkin-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .checkin-message {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      color: var(--text-dim);
      background: #fbfcfe;
    }

    .checkin-message.success {
      color: #166534;
      border-color: #bbf7d0;
      background: #f0fdf4;
    }

    .checkin-message.error {
      color: #991b1b;
      border-color: #fecaca;
      background: #fef2f2;
    }

    @media (max-width: 640px) {
      .public-checkin main {
        padding: 10px 10px calc(24px + env(safe-area-inset-bottom));
      }

      .checkin-shell {
        padding: 16px;
      }

      .language-field {
        justify-content: stretch;
        margin-bottom: 12px;
      }

      .language-field label {
        min-width: 0;
        width: 100%;
      }

      .checkin-header h1 {
        font-size: 1.3rem;
      }

      .stay-dates {
        gap: 8px;
      }

      .stay-date {
        width: 100%;
      }

      .field input,
      .field select,
      .language-field select {
        font-size: 16px;
        min-height: 48px;
      }

      .checkin-grid.two {
        grid-template-columns: 1fr;
      }

      .checkin-actions button {
        width: 100%;
      }

      .checkin-actions {
        position: sticky;
        bottom: 0;
        z-index: 2;
        margin: 18px -16px -16px;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
        background: var(--surface, #fff);
        border-top: 1px solid var(--border);
        box-shadow: 0 -4px 12px #00000008;
      }

      .field label { color: var(--text); }

      .guest-slot {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }

      .guest-slot span {
        text-align: left;
      }

      .guest-slot-cta {
        width: 100%;
        padding-top: 5px;
      }

      .guest-slot-actions,
      .guest-progress-add {
        width: 100%;
      }
    }
  </style>
</head>
<body class="public-checkin">
  <main>
    <section class="checkin-shell">
      <div class="language-field">
        <label for="language-select">
          <span id="language-label">Language</span>
          <select id="language-select" aria-label="Language">
            <option value="en">🇬🇧 English</option>
            <option value="pt">🇵🇹 Português</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="es">🇪🇸 Español</option>
            <option value="ko">🇰🇷 한국어</option>
          </select>
        </label>
      </div>

      <div class="checkin-header">
        <div id="property-context" class="property-context" hidden></div>
        <h1 id="page-title">Check-in</h1>
        <p id="page-subtitle">Loading...</p>
        <div id="stay-dates" class="stay-dates" hidden></div>
      </div>

      <div id="guest-progress" class="guest-progress" hidden></div>

      <div id="checkin-message" class="checkin-message" role="status" aria-live="polite" tabindex="-1"></div>

      <form id="guest-form" hidden>
        <div class="form-intro">
          <h2 id="form-title" tabindex="-1"></h2>
          <p id="form-instructions"></p>
        </div>
        <div class="checkin-grid two">
          <div class="field">
            <label for="first-name" data-i18n="firstName">Name</label>
            <input id="first-name" type="text" autocomplete="given-name" enterkeyhint="next" required>
            <small id="name-help" class="field-help"></small>
          </div>
          <div class="field">
            <label for="last-name" data-i18n="lastName">Last name</label>
            <input id="last-name" type="text" autocomplete="family-name" enterkeyhint="next" required>
          </div>
        </div>

        <div class="checkin-grid two">
          <div class="field">
            <label for="birth-date" data-i18n="birthDate">Date of birth</label>
            <input id="birth-date" type="date" autocomplete="bday" required>
          </div>
          <div class="field">
            <label for="document-type" data-i18n="documentType">Identification type</label>
            <select id="document-type" required></select>
          </div>
        </div>

        <div class="field">
          <label for="document-number" data-i18n="documentNumber">Identification number</label>
          <input id="document-number" type="text" autocomplete="off" enterkeyhint="next" required>
          <small class="field-help"><a id="why-data" href="#legal-information"></a></small>
        </div>

        <div class="checkin-grid two">
          <div class="field">
            <label for="country-origin" data-i18n="countryOrigin">Country of origin</label>
            <select id="country-origin" required></select>
          </div>
          <div class="field">
            <label for="country-residence" data-i18n="countryResidence">Country of residence</label>
            <select id="country-residence" required></select>
          </div>
        </div>

        <div class="field">
          <label for="document-country" data-i18n="documentCountry">Country of origin of the identification document</label>
          <select id="document-country" required></select>
        </div>

        <div id="individual-dates">
          <p data-i18n="stayHelp"></p>
          <div class="checkin-grid two">
            <div class="field"><label for="guest-checkin" data-i18n="checkin">Check-in</label><input id="guest-checkin" type="date" required></div>
            <div class="field"><label for="guest-checkout" data-i18n="checkout">Check-out</label><input id="guest-checkout" type="date" required></div>
          </div>
          <label class="declaration" id="unknown-checkout-label"><input id="unknown-checkout" type="checkbox"><span data-i18n="checkoutUnknown"></span></label>
          <p id="stay-error" role="alert" hidden></p>
        </div>
        <label class="declaration">
          <input id="declaration" type="checkbox" required>
          <span data-i18n="declaration">I declare the veracity of the data provided and I am aware of the legal basis which requires me to provide the data included on this form.</span>
        </label>

        <div class="checkin-actions">
          <button id="cancel-edit" type="button" hidden>Cancel</button>
          <button id="submit-guest" class="primary" type="submit">Submit</button>
          <p id="save-help" class="save-help"></p>
        </div>
      </form>
      <footer id="registration-information" class="registration-information"></footer>
    </section>
  </main>

  <script type="module" src="../js/boletim-public.js"></script>
</body>
</html>
